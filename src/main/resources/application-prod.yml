spring:
  datasource:
    url: jdbc:postgresql://${HOST_DB}:5432/meta_db
    username: admin
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show-sql: false      # 운영 환경에서는 보통 false로 설정
        format_sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: redis_container
      port: 6379
    mongodb:
      uri: mongodb://admin:${POSTGRES_PASSWORD}@${HOST_DB}:27017/meta_db?authSource=admin
      database: meta_db
  rabbitmq:
    host: ${HOST_RABBITMQ}
    port: 5672
    username: admin
    password: ${POSTGRES_PASSWORD}
  messaging:
    stomp:
      broker-relay:
        host: ${HOST_RABBITMQ}  # RabbitMQ 서버 IP
        port: 61613           # STOMP 기본 포트
        system-login: admin   # RabbitMQ 로그인 계정
        system-passcode: ${POSTGRES_PASSWORD}
        client-login: admin
        client-passcode: ${POSTGRES_PASSWORD}

app:
  oauth2:
    providers:
      google:
        clientId: ${GOOGLE_CLIENT_ID}
        clientSecret: ${GOOGLE_CLIENT_SECRET}
        redirectUri: "https://api.letzgo.site/rest-api/v1/oauth2/google"
        tokenUri: "https://oauth2.googleapis.com/token"
        userInfoUri: "https://www.googleapis.com/oauth2/v3/userinfo"
      naver:
        clientId: ${NAVER_CLIENT_ID}
        clientSecret: ${NAVER_CLIENT_SECRET}
        redirectUri: "https://api.letzgo.site/rest-api/v1/oauth2/naver"
        tokenUri: "https://nid.naver.com/oauth2.0/token"
        userInfoUri: "https://openapi.naver.com/v1/nid/me"
      kakao:
        clientId: ${KAKAO_CLIENT_ID}
        redirectUri: "https://api.letzgo.site/rest-api/v1/oauth2/kakao"
        tokenUri: "https://kauth.kakao.com/oauth/token"
        userInfoUri: "https://kapi.kakao.com/v2/user/me"

logging:
  level:
    org.springframework.web: INFO
    team.letzgo: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
